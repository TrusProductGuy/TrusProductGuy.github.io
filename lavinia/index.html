<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="Andy Trus — application for Director, Digital Products at Lavinia Group, a division of K12 Coalition." />
<title>Andy Trus — Director, Digital Products</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Source+Sans+3:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />

<script>
const CONFIG = {

  company:  "Lavinia Group",
  role:     "Director, Digital Products",
  resume:   "",
  year:     "2026",

  eyebrow: "DIRECTOR, DIGITAL PRODUCTS  ·  LAVINIA GROUP  ·  K12 COALITION",

  headline: {
    line1: "A curriculum only changes outcomes if teachers can use it on a Tuesday morning.",
    line2: "I've spent 14 years building the software that gets it there."
  },

  heroSub: "RedThread has earned its credibility in classrooms and in outside reviews. The risk in a digital product is diluting that; the opportunity is carrying it to every teacher who opens it. I led product for WebAssign, a $100M+ a year learning and testing platform, and today I'm building a new product team at McGraw Hill for K-12 digital assessments. That's the experience I'd bring to RedThread, along with the habit of turning what curriculum experts mean into what an engineering team can build.",

  stats: [
    { value: "21%",    label: "STATISTICS LINE GROWTH OVER 3 YEARS: DIGITAL TOOLS, CONTENT, AND TEXTBOOKS TOGETHER" },
    { value: "$2.75M", label: "SAVED BY AN AI CONTENT-REVIEW TOOL WE LAUNCHED" },
    { value: "90 days", label: "FROM IDEA TO A GEN AI MATH PROOF OF CONCEPT" }
  ],

  whyTitle: "Why Lavinia Group and why this role",
  whyBullets: [
    "<strong>Students: Product decisions that are really decisions about how students learn</strong> The work I enjoy most sits where product craft meets pedagogy. My background blends UX, product, and pedagogy, and I'm drawn to roles where a roadmap choice changes what a student actually experiences. A digital product built on a curriculum this deliberate is a chance to do that at the level of instruction, not just delivery.",
    "<strong>Mission: A curriculum that has been tested in public</strong> The Reading League's review of RedThread's first edition found it <a style='color:#4A3F9E' href='https://k12coalition.com/?p=8517'>met or mostly met 72 of 74 indicators</a>, and Indiana added it to its <a style='color:#4A3F9E' href='https://k12coalition.com/news/indiana-department-of-education-approves-redthread-literacy-for-k-8-core-reading/'>high-quality curricular materials list</a>. Software that holds that standard is worth building, and I'd like to spend my time on it.",
    "<strong>Curriculum: One program, many formats</strong> RedThread's Knowledge, Foundations, and decodable Readers have to feel like one program in a teacher's hands. That is a product problem as much as a curriculum one, and it is the kind I find most interesting.",
    "<strong>AI: Starting from what teachers need</strong> AI in the classroom gets interesting when it starts from a real instructional need. A student work feedback app is that kind of problem: what does a teacher need from feedback, and what do RedThread's own rubrics and exemplars say good work looks like?",
    "<strong>Role: Bringing curriculum and technology together</strong> This role sits between curriculum, editorial, technology, and outside developers, and the job is helping those groups move as one. Shaping how a product organization works is the part of every job I've enjoyed most."
  ],


  bringTitle: "What I'd bring to the role",
  cards: [
    { title: "Roadmaps that start from instructional value",
      body: "Four times, I've come into a role with no playbook and built one. At McGraw Hill, I was hired to establish a new product team and operating model, and restructured it around OKRs to improve delivery predictability. At WebAssign, I led product for a $100M+ a year platform and focused the roadmap on the enhancements most critical to customer retention, which improved CSAT and beat forecast with 10% unit growth over two years. I prioritize by what changes teaching and learning first, then by feasibility and cost." },
    { title: "Curriculum and software that read as one product",
      body: "On the Statistics line, a 9-person cross-functional team covered digital tools, content, and textbooks, and I managed a budget of about $500K a year, hiring authors and vendors for content and technology launches. We launched a textbook under budget that grew 40%, and a data analysis tool that more than 80% of teachers agreed improved teaching and learning outcomes. We also partnered with experts on video lessons, using a storytelling framework other product teams later adopted. At WebAssign, I led a cross-functional team through content development guidelines and go-to-market to relaunch Mastery Learning as a new product offering." },
    { title: "AI that earns its place",
      body: "At McGraw Hill, we launched an internal AI tool that finds errors in assessment content, saving $2.75M in vendor review costs, and new assessment grading capabilities aimed at a source of churn worth millions. I also started a committee to bring AI prototyping to K-12 product teams, and I built an AI agent that raises the quality of my team's product requirements." },
    { title: "Educator feedback and usage data that decide what ships next",
      body: "At McGraw Hill, I defined acquisition, engagement, and retention measures for a new K-12 assessment product team and built the dashboards that became the standard across other product lines. I do discovery directly with teachers and customers, and at WebAssign I rebuilt how product, engineering, and sales worked together on it. That is how we found usability wins like a course setup tool that saved teachers thousands of hours, and it is the loop I'd want for RedThread: educator feedback and usage data deciding what we build next." },
  ],

  questions: [
    "<a style='color:#4A3F9E' href='https://scale.stanford.edu/sites/default/files/The%20Evidence%20Base%20on%20AI%20in%20K-12%20Report.pdf'>A 2026 Stanford SCALE review of the evidence on AI in K-12</a> describes a 2021 study of AI automated writing feedback (Ferman et al.): student writing outcomes improved, teachers' total work-from-home hours did not fall, and teachers with access discussed more essays individually with students. If that pattern holds, AI feedback doesn't save teachers time; it changes how they spend it. So what should a student work feedback app be built to produce: hours saved, or more individual conversations between teachers and students about their writing? I'd want to decide which one RedThread's app is for, because it changes what we build, what we measure, and what we can honestly promise a district.",
    "<a style='color:#4A3F9E' href='https://www.edweek.org/teaching-learning/the-science-of-reading-movement-is-evolving-is-math-next/2026/08'>EdWeek reports</a> that more than 40 states have implemented science of reading policies, and that newly enacted math laws echo some of the same priorities, including universal screening, targeted intervention, and data-based decision-making. If math follows reading's path, should a literacy-and-math curriculum have one digital layer serving both subjects, or two? RedThread's literacy program is built on structured phonics and knowledge-building and its math curriculum on story problems, so the answer isn't obvious. I'd want to work out where the two should share a platform and where each needs its own, before committing a roadmap to either.",
    "RedThread is the core ELA curriculum inside Lavinia RISE, where <a style='color:#4A3F9E' href='https://k12coalition.com/?p=6160'>Summer Discovery sites in Southeast Michigan saw 2.4x more students proficient in math and 3.1x more in ELA in summer 2025</a>. Districts buy on results like these. Could a digital layer show which parts of implementation, such as training attended, units completed, and routines used, travel with the results? I'd want to find out whether that would help leaders decide to renew and help coaches decide where to go next."
  ],

  closing: "I'd welcome the chance to talk any of this through, and to hear where your view of RedThread's digital future differs from mine.",

  linkedin: "linkedin.com/in/andy-trus",
  email: "trus.productguy@gmail.com",
  phone: "301-461-6166"
};
</script>

<style>
  :root {
    --ink:      #1A2038;
    --accent:   #4A3F9E;
    --bg:       #F6F5FA;
    --mark:     #9A4F08;
    --charcoal: #26283A;
    --white:    #FFFFFF;
    --line:     rgba(26,32,56,0.16);
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--charcoal);
    font-family: 'Source Sans 3', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3 { font-family: 'Fraunces', serif; margin: 0; color: var(--ink); }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    * { animation: none !important; transition: none !important; }
  }

  .skip-link {
    position: absolute; left: 12px; top: -60px; z-index: 10;
    background: var(--ink); color: var(--white); padding: 10px 16px; border-radius: 4px;
    font-weight: 600; text-decoration: none;
  }
  .skip-link:focus { top: 12px; }

  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 28px; }

  .divider { width: 100%; height: 28px; display: block; }
  .divider line { stroke: var(--mark); stroke-width: 2; opacity: 0.55; }
  .divider circle { fill: var(--mark); opacity: 0.8; }

  header { padding: 40px 0 0; }
  .eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px; letter-spacing: 0.12em; color: var(--accent);
    margin: 0 0 22px;
  }

  .hero { padding: 8px 0 36px; }
  .hero h1 {
    font-size: clamp(34px, 5.4vw, 56px);
    line-height: 1.1;
    font-weight: 500;
    letter-spacing: -0.01em;
  }
  .hero h1 em { font-style: italic; color: var(--accent); }
  .hero-sub {
    margin: 22px 0 0; font-size: 19px; line-height: 1.6;
    max-width: 780px; color: var(--charcoal);
  }

  .stats {
    display: grid; grid-template-columns: repeat(3, 1fr);
    border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
    margin: 30px 0 44px; padding: 0; list-style: none;
  }
  .stat { padding: 22px 16px; text-align: left; border-left: 1px solid var(--line); }
  .stat:first-child { border-left: none; }
  .stat-value { font-family: 'Fraunces', serif; font-size: clamp(19px, 2.6vw, 26px); color: var(--ink); font-weight: 500; }
  .stat-label {
    font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.06em;
    color: var(--accent); margin-top: 6px; text-transform: uppercase;
  }

  .why { padding: 8px 0 46px; }
  .why h2 { font-size: 26px; font-weight: 500; margin-bottom: 16px; }
  .why-list { margin: 0; padding: 0; list-style: none; max-width: 820px; }
  .why-list li {
    position: relative; padding: 12px 0 12px 24px; font-size: 17px; line-height: 1.65;
    border-bottom: 1px solid var(--line);
  }
  .why-list li:first-child { border-top: 1px solid var(--line); }
  .why-list li::before {
    content: "\2013"; position: absolute; left: 0; color: var(--mark); font-weight: 600;
  }

  .bring { padding: 10px 0 50px; }
  .bring h2 { font-size: 26px; font-weight: 500; margin-bottom: 24px; }
  .card-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .card {
    background: var(--white); border: 1px solid var(--line); border-radius: 6px;
    padding: 26px 24px; border-top: 3px solid var(--mark);
  }
  .card h3 { font-size: 18.5px; font-weight: 500; margin-bottom: 10px; line-height: 1.3; }
  .card p { font-size: 15.5px; line-height: 1.62; color: var(--charcoal); margin: 0; }

  .values { padding: 10px 0 50px; }
  .values h2 { font-size: 26px; font-weight: 500; margin-bottom: 24px; }
  .values-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 40px; margin: 0; padding: 0; list-style: none; }
  .value { padding: 18px 0 20px; border-top: 1px solid var(--line); }
  .value h3 { font-size: 18.5px; font-weight: 500; margin-bottom: 8px; line-height: 1.3; }
  .value p { font-size: 15.5px; line-height: 1.62; margin: 0; }

  .questions { padding: 10px 0 50px; }
  .questions h2 { font-size: 26px; font-weight: 500; margin-bottom: 22px; }
  .q-list { margin: 0; padding: 0; list-style: none; }
  .q-item {
    display: flex; gap: 16px; padding: 18px 0; border-bottom: 1px solid var(--line);
  }
  .q-item:first-child { border-top: 1px solid var(--line); }
  .q-num { font-family: 'IBM Plex Mono', monospace; color: var(--mark); font-weight: 500; font-size: 14px; padding-top: 2px; min-width: 22px; }
  .q-text { font-size: 16.5px; line-height: 1.6; }

  .closing { padding: 6px 0 44px; }
  .closing p { font-family: 'Fraunces', serif; font-size: clamp(22px, 3vw, 30px); line-height: 1.35; font-weight: 500; font-style: italic; color: var(--accent); margin: 0; }

  footer {
    padding: 40px 0 60px; border-top: 1px solid var(--line); margin-top: 10px;
  }
  .foot-row { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 18px; }
  .foot-name { font-family: 'Fraunces', serif; font-size: 20px; color: var(--ink); }
  .foot-links a {
    color: var(--accent); text-decoration: underline; text-underline-offset: 3px; font-size: 14.5px; margin-left: 20px;
  }
  .foot-links a:first-child { margin-left: 0; }
  .foot-links a.resume-btn {
    display: inline-block; background: var(--ink); color: var(--white);
    padding: 10px 20px; border-radius: 4px; font-weight: 500; text-decoration: none;
  }
  .foot-links a.resume-btn:hover { background: var(--accent); }
  .credit { margin: 22px 0 0; font-size: 13px; color: #55586B; }

  a:focus-visible, button:focus-visible { outline: 3px solid var(--mark); outline-offset: 2px; }

  @media (max-width: 680px) {
    .card-grid { grid-template-columns: 1fr; }
    .values-grid { grid-template-columns: 1fr; }
    .stats { grid-template-columns: 1fr; }
    .stat { border-left: none; border-top: 1px solid var(--line); }
    .stat:first-child { border-top: none; }
    .foot-row { flex-direction: column; align-items: flex-start; }
    .foot-links a { margin-left: 0; margin-right: 18px; }
  }
</style>
</head>
<body>

<a class="skip-link" href="#main">Skip to main content</a>

<div class="wrap">
  <header>
    <p class="eyebrow" id="eyebrow"></p>
  </header>

  <main id="main">
    <section class="hero" aria-labelledby="headline">
      <h1 id="headline"></h1>
      <p class="hero-sub" id="heroSub"></p>
    </section>

    <svg class="divider" viewBox="0 0 900 28" preserveAspectRatio="none" aria-hidden="true" focusable="false"><line x1="0" y1="14" x2="420" y2="14"/><circle cx="440" cy="14" r="4"/><circle cx="450" cy="14" r="4"/><circle cx="460" cy="14" r="4"/><line x1="480" y1="14" x2="900" y2="14"/></svg>

    <ul class="stats" id="stats" aria-label="Highlights"></ul>

    <section class="why" aria-labelledby="whyTitle">
      <h2 id="whyTitle"></h2>
      <div id="why"></div>
    </section>

    <section class="bring" aria-labelledby="bringTitle">
      <h2 id="bringTitle"></h2>
      <div class="card-grid" id="cards"></div>
    </section>

    <svg class="divider" viewBox="0 0 900 28" preserveAspectRatio="none" aria-hidden="true" focusable="false"><line x1="0" y1="14" x2="420" y2="14"/><circle cx="440" cy="14" r="4"/><circle cx="450" cy="14" r="4"/><circle cx="460" cy="14" r="4"/><line x1="480" y1="14" x2="900" y2="14"/></svg>

    <section class="questions" aria-labelledby="qTitle">
      <h2 id="qTitle">Questions I'm sitting with</h2>
      <ol class="q-list" id="questions"></ol>
    </section>

    <section class="closing" aria-label="Closing">
      <p id="closing"></p>
    </section>
  </main>

  <footer>
    <div class="foot-row">
      <div class="foot-name" id="footName"></div>
      <nav class="foot-links" id="footLinks" aria-label="Contact and résumé"></nav>
    </div>
    <p class="credit">Built with Claude.</p>
  </footer>
</div>

<script>
  document.title = "Andy Trus — " + CONFIG.role;
  document.getElementById('eyebrow').textContent = CONFIG.eyebrow;

  document.getElementById('headline').innerHTML =
    CONFIG.headline.line1 + " <em>" + CONFIG.headline.line2 + "</em>";

  document.getElementById('heroSub').textContent = CONFIG.heroSub;

  document.getElementById('stats').innerHTML = CONFIG.stats.map(s => `
    <li class="stat">
      <div class="stat-value">${s.value}</div>
      <div class="stat-label">${s.label}</div>
    </li>
  `).join('');

  document.getElementById('whyTitle').textContent = CONFIG.whyTitle;
  document.getElementById('why').innerHTML = '<ul class="why-list">' +
    CONFIG.whyBullets.map(b => `<li>${b}</li>`).join('') +
    '</ul>';

  document.getElementById('bringTitle').textContent = CONFIG.bringTitle;
  document.getElementById('cards').innerHTML = CONFIG.cards.map(c => `
    <div class="card">
      <h3>${c.title}</h3>
      <p>${c.body}</p>
    </div>
  `).join('');

  document.getElementById('questions').innerHTML = CONFIG.questions.map((q,i) => `
    <li class="q-item">
      <span class="q-num" aria-hidden="true">0${i+1}</span>
      <span class="q-text">${q}</span>
    </li>
  `).join('');

  document.getElementById('closing').textContent = CONFIG.closing;

  document.getElementById('footName').textContent = "Andy Trus · " + CONFIG.year;
  document.getElementById('footLinks').innerHTML = `
    <a href="mailto:${CONFIG.email}">${CONFIG.email}</a>
    <a href="https://${CONFIG.linkedin}">${CONFIG.linkedin}</a>
    ${CONFIG.resume ? `<a class="resume-btn" href="${CONFIG.resume}">View Résumé</a>` : ""}
  `;
</script>
</body>
</html>
